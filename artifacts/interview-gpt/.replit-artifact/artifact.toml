kind = "web"
previewPath = "/"
title = "InterviewGPT"
version = "1.0.0"
id = "artifacts/interview-gpt"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18695

[services.development]
run = "pnpm --filter @workspace/interview-gpt run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/interview-gpt", "run", "build" ]
publicDir = "artifacts/interview-gpt/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18695"
BASE_PATH = "/"
